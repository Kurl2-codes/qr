services:
  mongodb:
    image: mongo:latest
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - MONGODB_URL=${DB_URL}
      - DATABASE_NAME=qr360
      - SECRET_KEY=${SECRET_KEY}
      - PROXY_BASE_URL=${BACKEND_URL}/q/
      - BACKEND_CORS_ORIGINS=["${FRONTEND_URL}"]
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${BACKEND_URL}/api
        - VITE_UPLOAD_BASE_URL=${BACKEND_URL}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mongo_data:
